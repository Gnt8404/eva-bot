  - id: core-sorrow
    title: "Sorrow: авторский мир-лабиринт"
    topic: sorrow
    source_label: "#Aetherlyn #sorrow"
    source_url: "https://t.me/+utbI0nXnzAhmMWYy"
    tags: ["#Aetherlyn", "Sorrow", "механики"]
    priority: 90
    whole: true
    summary: "Sorrow — мир-лабиринт с записками, квестами, промокодами, мимиком, рулеткой и собором."
    content: |
      Sorrow (плагин Sorrow 1.48.2) — авторский мир-лабиринт.
      В нём есть записки, квесты, промокоды, мимик, рулетка, душевный магазин и катакомбы со структурами.
      Души на старте сезона 3 убраны; душевный магазин относится к механике Sorrow.
      Как именно получить конкретный предмет или пройти конкретную структуру, в базе знаний не описано.
