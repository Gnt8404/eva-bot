  - id: core-donation
    title: "Донат: печати и игровой пасс"
    topic: donate
    source_label: "#Aetherlyn #donate"
    source_url: "https://t.me/+utbI0nXnzAhmMWYy"
    tags: ["#Aetherlyn", "донат", "печати"]
    priority: 95
    whole: true
    summary: "Печати покупаются пакетами; игровой пасс стоит 150 ₽. Выдача только после подтверждения владельца."
    content: |
      В донате доступны пакеты печатей (от 5 до 1000) и игровой пасс.
      Игровой пасс: 150 ₽ / 188 звёзд / 1.65 $ / 45 000 сум.
      Автоматического подтверждения оплаты нет: владелец проверяет чек вручную.
      После подтверждения бот выдаёт промокод и передаёт команду выдачи на сервер.
      Полная таблица цен и реквизиты — в разделе «Донаты».
