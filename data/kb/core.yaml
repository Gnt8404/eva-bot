  - id: core-commands
    title: "Основные команды сервера"
    topic: commands
    source_label: "#Aetherlyn #commands"
    source_url: "https://t.me/+utbI0nXnzAhmMWYy"
    tags: ["#Aetherlyn", "команды", "плагины"]
    priority: 70
    whole: true
    summary: "Доступны телепорты, авторизация, браки, голосовой чат и другие команды плагинов."
    content: |
      AdvancedTeleport: /tpa, /spawn, /home, /warp.
      Вернуться к месту смерти: /back, если команда доступна.
      SimpleLogin: /login и /register.
      Wedding оформляет браки между игроками; voicechat отвечает за голосовой чат.
      PvP переключается плагином pvpoption.
      Экономика и базовые команды — EssentialsX; боевой пропуск — MSP-BattlePass.
      Полный перечень команд конкретных плагинов в базе знаний не зафиксирован.
