  - id: core-rules
    title: "Правила сервера: что зафиксировано"
    topic: rules
    source_label: "#Aetherlyn #rules"
    source_url: "https://t.me/+utbI0nXnzAhmMWYy"
    tags: ["#Aetherlyn", "правила"]
    priority: 95
    whole: true
    summary: "Aetherlyn — PvE-сервер; гриферство фиксируется CoreProtect; PvP только по переключателю."
    content: |
      Aetherlyn — выживание/PvE-сервер с авторскими механиками.
      Гриферство и изменения блоков фиксируются CoreProtect-CE; по обращению администрация может откатить ущерб.
      PvP включается и выключается плагином pvpoption; насильственный PvP не является режимом сервера.
      Для входа используется авторизация SimpleLogin: /login и /register.
      Полный свод правил публикуется владельцем в главном канале; в базе знаний зафиксированы только перечисленные факты.
  - id: core-connection
    title: "Как подключиться и зайти с Bedrock"
    topic: connection
    source_label: "#Aetherlyn #connect"
    source_url: "https://t.me/+utbI0nXnzAhmMWYy"
    tags: ["#Aetherlyn", "подключение", "bedrock"]
    priority: 95
    whole: true
    summary: "Порт 25646, Java Paper 1.21.11; Bedrock через Geyser/Floodgate."
    content: |
      Подключение: Minecraft Java, адрес сервера публикует владелец в главном канале, порт 25646.
      Версия сервера: Paper 1.21.11 (build 127).
      Клиенты других версий поддерживаются через ViaVersion и ViaBackwards.
      Bedrock (телефон/консоль) заходит через Geyser и Floodgate; скины Bedrock восстанавливает BedrockSkinRestorer.
      online-mode=false, поэтому после входа нужна авторизация SimpleLogin: /register или /login.
      IP-адрес в базе знаний не зафиксирован; не выдумывайте его.
  - id: core-plugins-overview
    title: "Плагины Aetherlyn"
    topic: plugins
    source_label: "#Aetherlyn #plugins"
    source_url: "https://t.me/+utbI0nXnzAhmMWYy"
    tags: ["#Aetherlyn", "плагины"]
    priority: 80
    whole: true
    summary: "На сервере 26 строк плагинов, включая Sorrow, Geyser/Floodgate, CoreProtect-CE и GrimAC."
    content: |
      Полный список плагинов доступен в меню «Плагины и датапаки» и в файле plugins.yaml базы знаний.
      Ключевые плагины: AdvancedTeleport, AetherlynTab, AxGraves, BedrockSkinRestorer, Chunky,
      CoreProtect-CE, EssentialsX, Geyser + Floodgate, InventoryRollbackPlus, LogCleaner,
      LuckPerms, MSP-BattlePass, PlaceholderAPI, ProtocolLib, RedstoneReboot, SimpleLogin,
      SkinsRestorer, Sorrow, ViaVersion + ViaBackwards, Wedding, GrimAC, pvpoption,
      voicechat, WorldEdit, WorldGuard, zMItemsBuilder.
      Плагины синхронизируются с сервером через API панели, когда панель доступна.
