documents:
  - id: core-server
    title: "Aetherlyn: основные факты"
    topic: server
    source_label: "#Aetherlyn #server"
    source_url: "https://t.me/+utbI0nXnzAhmMWYy"
    tags: ["#Aetherlyn", "сервер"]
    priority: 100
    whole: true
    summary: "Aetherlyn — Minecraft Java, Paper 1.21.11 (build 127), порт 25646, сезон 3."
    content: |
      Название: Aetherlyn, сезон 3.
      Платформа: Minecraft Java, Paper 1.21.11 (build 127).
      Порт: 25646.
      Режим: выживание, PvE-ванильный с авторскими механиками.
      Сложность: hard; максимум игроков: 20.
      view-distance и simulation-distance: 8; spawn-protection: 16.
      online-mode=false: вход разрешён без Mojang-авторизации, с Bedrock через Geyser/Floodgate.
      MOTD: «Aetherlyn ванильный пве сервер для ваших лучших проектов».
      IP-адрес в базе знаний не зафиксирован; его публикует владелец в главном канале.
  - id: core-season3
    title: "Сезон 3 и активность"
    topic: season
    source_label: "#Aetherlyn #season3"
    source_url: "https://t.me/+utbI0nXnzAhmMWYy"
    tags: ["#Aetherlyn", "сезон", "вайп"]
    priority: 90
    whole: true
    summary: "Сезон 3 стартовал заново: души на старте убраны, все измерения открыты."
    content: |
      Сезон 3 стартовал заново.
      Души на старте убраны, чтобы нельзя было закупиться и сразу идти на дракона.
      Все измерения открыты.
      Новые механики, события и розыгрыши выходят по активности игроков.
      Ориентир стабильного онлайна — 5–7 человек.
      Периодически проводится чистка неактивных игроков.
      Активность подтверждается скриншотом команды /playtime под постом о чистке.
