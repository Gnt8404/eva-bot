# /etc/nginx/conf.d/eva-bot.conf
# Terminates TLS and forwards Telegram webhook calls to the local bot.
limit_req_zone $binary_remote_addr zone=eva_webhook:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name eva.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eva.example.com;

    ssl_certificate     /etc/letsencrypt/live/eva.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eva.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 25m;

    location = /webhook {
        limit_req zone=eva_webhook burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 30s;
    }

    location = /health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
