# Не даём бесплатному сервису Render заснуть: пингуем его раз в 10 минут.
# Render усыпляет бесплатные веб-сервисы после 15 минут без HTTP-запросов,
# а боту нужен постоянный поллинг Telegram.
name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Eva bot
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 50 https://eva-bot-uulx.onrender.com/ || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "сервис не ответил, но попытки сделаны"
