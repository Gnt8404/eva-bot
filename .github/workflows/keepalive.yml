name: Keep Eva v2 awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Eva v2 health endpoint
        run: |
          curl --fail --silent --show-error --max-time 90 https://eva-bot-v2.onrender.com/health